name: Release validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      export_mobile:
        description: Explicitly authorise the deferred mobile bundle export
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only-ci
          POSTGRES_DB: easygas_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EASYGAS_ENABLE_LOCAL_PG_TESTS: "yes"
      EASYGAS_TEST_POSTGRES_URL: postgresql://postgres:fixture-only-ci@127.0.0.1:5432/easygas_test_ci
      EASYGAS_BACKGROUND_JOBS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm ci --prefix apps/mobile --ignore-scripts
      - run: mkdir -p artifacts && npm test > artifacts/tests.txt 2>&1
      - run: npm run build > artifacts/build.txt 2>&1
      - run: npm run typecheck > artifacts/types.txt 2>&1
      - run: npm audit --omit=dev --audit-level=high > artifacts/dependency-audit.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-validation
          path: artifacts/
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - if: github.event_name == 'workflow_dispatch' && inputs.export_mobile
        run: npx expo export --platform all --output-dir ../../artifacts/native
        env:
          EXPO_PUBLIC_API_URL: https://easygasng.com
      - run: npm audit --omit=dev --audit-level=moderate
