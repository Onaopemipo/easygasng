<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EasyGas — Mobile experience studio</title><link rel="stylesheet" href="design.css"></head><body>
<aside class="studio-nav"><a href="#c-home" class="studio-brand"><img src="assets/logo.png" alt="EasyGas Energy Solutions"></a><div class="overline">MOBILE EXPERIENCE / V1.0</div><h1>A little less worry.<br>A lot more cooking.</h1><p class="studio-intro">One connected experience, designed around your day.</p><label class="search-box"><span>⌕</span><input id="screenSearch" placeholder="Find a screen…" aria-label="Find a screen"></label><nav id="screenNav" aria-label="Screen inventory"></nav><footer>INTERACTIVE DESIGN PROTOTYPE<br>Sample data · no live transactions</footer></aside>
<main class="studio-main"><header class="studio-toolbar"><div class="personas" id="personas" aria-label="Choose workspace"></div><div class="toolbar-right"><button id="themeToggle" class="studio-button" aria-label="Toggle light and dark themes">◐ <span>Dark mode</span></button><select id="widthControl" aria-label="Device width"><option value="390">390 · iPhone</option><option value="360">360 · Compact</option><option value="430">430 · Large</option></select><button id="reset" class="studio-button">Reset</button></div></header><div class="canvas"><div class="device-area"><div class="screen-caption"><span class="live-dot"></span><span id="screenCaption">Customer / Overview</span></div><div class="device" id="device"><div class="statusbar"><strong>9:41</strong><div class="island"></div><span>▮▮▮  ▰</span></div><div class="app-head" id="appHeader"></div><div class="app-scroll" id="app"></div><nav class="tabbar" id="tabbar" aria-label="Mobile navigation"></nav><div class="home-indicator"></div><div id="sheetHost"></div><div class="toast" id="toast" role="status"></div></div><div class="state-bar"><label for="stateControl">Screen state</label><select id="stateControl"><option value="ready">Populated example</option><option value="empty">Empty</option><option value="loading">Loading</option><option value="error">Error + retry</option><option value="offline">Offline</option><option value="restricted">Access restricted</option></select></div></div><aside class="design-guide" id="guide"></aside></div></main>
<script src="manifest.js"></script><script src="app.js"></script></body></html>
