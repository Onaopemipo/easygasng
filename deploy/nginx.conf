# Install behind your certificate manager. Replace both certificate paths.
# Only nginx is public; Next listens on loopback:3000.
limit_req_zone $binary_remote_addr zone=easygas_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=easygas_auth:10m rate=5r/m;
server {
    listen 80;
    server_name easygasng.com www.easygasng.com;
    return 308 https://easygasng.com$request_uri;
}
server {
    listen 443 ssl;
    server_name www.easygasng.com;
    ssl_certificate /etc/letsencrypt/live/easygasng.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easygasng.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://easygasng.com$request_uri;
}
server {
    listen 443 ssl;
    server_name easygasng.com;
    ssl_certificate /etc/letsencrypt/live/easygasng.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easygasng.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 9m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ ^/api/(login|register|account\.(recover|reset|verify)|phone\.(login|otp|review|complete)|invitation\.accept)$ {
        limit_req zone=easygas_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ {
        limit_req zone=easygas_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
